<!-- ============ Desktop Sidebar ============ -->
<aside class="sidebar" aria-label="Primary navigation">
  <div class="sidebar__brand">
    <app-brand-mark [size]="32" />
    <span class="sidebar__brand-text">Money Planner</span>
  </div>

  <nav class="sidebar__nav">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: item.path === '/home' }"
        class="sidebar__link"
      >
        <tabler-icon [icon]="item.icon" [size]="20" [stroke]="1.75" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  @if (designPreviewEnabled) {
    <div class="sidebar__footer">
      <a
        routerLink="/design-preview"
        routerLinkActive="sidebar__link--active"
        class="sidebar__link sidebar__link--small"
      >
        <tabler-icon icon="palette" [size]="16" [stroke]="1.75" />
        <span>Design Preview</span>
      </a>
    </div>
  }
</aside>

<!-- ============ Mobile Header ============ -->
<header class="mobile-header">
  <div class="mobile-header__brand">
    <app-brand-mark [size]="24" />
    <span class="mobile-header__brand-text">Money Planner</span>
  </div>

  <div class="mobile-header__actions">
    @if (designPreviewEnabled) {
      <a
        routerLink="/design-preview"
        routerLinkActive="mobile-header__action--active"
        class="mobile-header__action"
        aria-label="Open design preview"
      >
        <tabler-icon icon="palette" [size]="22" [stroke]="1.75" />
      </a>
    }
    <a
      [routerLink]="profileItem.path"
      routerLinkActive="mobile-header__action--active"
      class="mobile-header__action"
      aria-label="Open profile"
    >
      <tabler-icon [icon]="profileItem.icon" [size]="22" [stroke]="1.75" />
    </a>
  </div>
</header>

<!-- ============ Main Content ============ -->
<main class="main">
  <div class="main__content">
    <router-outlet />
  </div>
</main>

<!-- ============ Mobile Bottom Nav ============ -->
<nav class="bottom-nav" aria-label="Primary navigation">
  @for (item of mobileNavItems; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="bottom-nav__link--active"
      [routerLinkActiveOptions]="{ exact: item.path === '/home' }"
      class="bottom-nav__link"
    >
      <tabler-icon [icon]="item.icon" [size]="22" [stroke]="1.75" />
      <span class="bottom-nav__label">{{ item.label }}</span>
    </a>
  }
</nav>
